name: mushir
description: "Mushir — AI-Powered Mobility Assistant for Blind and Visually Impaired Users"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Live Camera & Sensors
  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  sensors_plus: ^5.0.1
  flutter_compass: ^0.7.0
  geolocator: ^11.0.0

  # Voice & Audio
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5

  # Computer Vision & Machine Learning
  tflite_flutter: ^0.10.4
  image: ^4.1.7

  # Networking & Storage
  http: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/labels/
