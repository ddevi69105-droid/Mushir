name: mushir
description: "Mushir — AI-Powered Mobility Assistant for Blind and Visually Impaired Users"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Live Camera & Sensors
  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  sensors_plus: ^5.0.1
  geolocator: ^11.0.0

  # Voice & Audio
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5

  # State Management & Network
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
